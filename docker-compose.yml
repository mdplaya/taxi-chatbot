services:
  valkey:
    image: valkey/valkey:7-alpine
    container_name: taxi-chatbot-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taxi-network

  mcp-server:
    build: 
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: taxi-chatbot-mcp-server
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_PORT=8001
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - taxi-network

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: taxi-chatbot-api
    ports:
      - "8000:8000"
    depends_on:
      - mcp-server
      - valkey
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_AGENT_DB=1
      - AGENT_REASONING_MODEL=gpt-5-mini
      - REASONING_TEMPERATURE=1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - taxi-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxi-chatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    # Commented out volumes to use the built app inside container
    # Uncomment for development with hot-reload
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    networks:
      - taxi-network

networks:
  taxi-network:
    driver: bridge

volumes:
  valkey_data:
    driver: local
